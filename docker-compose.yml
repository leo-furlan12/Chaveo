services:

  postgres:
    image: postgres:16-alpine
    container_name: chaveo-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaveo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaveo-backend
    
    ports:
      - "4000:4000"
    
    volumes:
      - ./backend:/app
      - /app/node_modules


    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: chaveo
      PORT: 4000
    
    

    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chaveo-frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000

    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
     
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
volumes:
  postgres_data: