services:

  postgres:
    image: postgres:17
    container_name: chaveo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaveo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend

    container_name: chaveo-backend
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: chaveo
      PORT: 3001

    ports:
      - "3001:3001"

    depends_on:
      - postgres


  frontend:
    build:
      context: ./frontend

    container_name: chaveo-frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  postgres_data: